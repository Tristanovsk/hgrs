# Default configuration of hGRS.
#
# Do not edit this file: write the settings to change in your user configuration file,
# ~/.config/hgrs/config.yml (create it with `hgrs_config --init /path/to/lut`). Only the keys that
# differ from these defaults are needed. Print the configuration in use with `hgrs_config`.

# true: former parameters (old_config.yml) and algorithms of hGRS; also set by the environment
# variable HGRS_PREVIOUS_BEHAVIOR
previous_behavior: false

path:
  # folder of the look-up tables (LUTs); also set by the environment variable HGRS_DATA_ROOT;
  # null: default folder of the user data, ~/.local/share/hgrs/lut on Linux (see `hgrs_config`)
  data_root: null
  # LUT file names, in data_root (the files shipped with the package, in hgrs/data/lut, are used
  # when they are not found in data_root)
  toa_lut: 'toa_lut_opac_wind_up_v3.nc'
  trans_lut: 'transmittance_lut_opac_wind_v3.nc'
  abs_gas_file: 'lut_abs_opt_thickness_normalized.nc'

atmospheric_correction:
  product:
    # --- spectral water mask: water if NDWI > ndwi_threshold, mean TOA reflectance over the sunglint
    # bands < sunglint_threshold and green-SWIR index > green_swir_index_threshold
    sunglint_wavelengths_nm: [2150, 2250]       # sunglint bands (also used for the sunglint retrieval)
    green_mask_wavelengths_nm: [540, 570]       # green bands of the NDWI and green-SWIR index
    nir_mask_wavelengths_nm: [850, 882]         # NIR bands of the NDWI
    green_swir_mask_wavelengths_nm: [1580, 1650]  # SWIR bands of the green-SWIR index
    sunglint_threshold: 0.11
    ndwi_threshold: 0.01
    green_swir_index_threshold: 0.1
    # --- PRISMA only: pixels excluded from the retrievals according to the land cover classes of the
    # L2C product (kept: valid classes, and unlabeled pixels away from the forbidden classes)
    prisma_land_mask_enabled: true
    prisma_land_valid_classes: [0, 5, 6]
    prisma_land_forbidden_classes: [1, 2, 3, 4, 10]
    # --- retrieval grid: water vapor, aerosol and sunglint are retrieved on mega-pixels of
    # x_coarsen x y_coarsen pixels having at least water_pixel_percentage % of water pixels
    x_coarsen: 20
    y_coarsen: 20
    water_pixel_percentage: 20
    block_size: 2                # mega-pixels per side of the blocks processed in parallel
    angle_rounding_digits: 1     # rounding of the angles (fewer LUT interpolations)
    # factor kappa of CO2, O2 and O4 in the gaseous optical thickness
    gas_absorption_scattering_coefficient: 0.35
  # transmittance of the final correction: true, computed for the scene-mean AOT;
  # false, for the smoothed AOT of each mega-pixel
  bidirectional_transmittance_global: false
  water_vapor:
    wavelengths_nm: [800, 1300]  # fitting range of the water vapor retrieval
    # first guess of the water vapor column W (kg m-2) and of the coefficients a, b of the
    # background reflectance a * wl + b (wl in micron), fitted as Twv(W) * (a * wl + b)
    first_guess: [2, -0.04, 0.1]
    # smoothing of the water vapor: none, weighted_local (mean weighted by the inverse variance of
    # the retrieval, then NaN-mean) or nanmean_local, over smoothing_window mega-pixels
    smoothing_method: weighted_local
    smoothing_window: [5, 5]
  aerosol:
    # bands fitted by the aerosol and sunglint retrieval (nm, nearest band of the sensor)
    fit_wavelengths_nm: [1000, 1050, 1075, 1100, 1200, 1300, 1600, 1650, 1700, 2150, 2200, 2250]
    # bands where the retrieved water reflectance must remain non-negative (constraint)
    nonnegative_reflectance_wavelengths_nm: [430, 490, 560, 650, 750, 800, 865, 1020]
    # bands removed from the processing (strong gaseous absorption)
    excluded_wavelength_ranges_nm: [[935, 967], [1105, 1170], [1320, 1490], [1778, 2033], [2465, 2550]]
    # smoothing of the AOT: none, weighted_local (mean over smoothing_window mega-pixels weighted by
    # their number of water pixels) or nanmean_local; then NaN-mean gap filling over smoothing_footprint
    smoothing_method: weighted_local
    smoothing_window: [3, 3]
    smoothing_footprint: [3, 3]
    # SLSQP solver: maximum number of iterations, tolerance (null: scipy default), start each
    # mega-pixel from the solution of the previous one (warm start)
    solver_max_iterations: 20
    solver_ftol: 1.0e-10
    solver_warm_start: false

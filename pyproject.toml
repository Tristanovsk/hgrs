# pyproject.toml
[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hGRS"
#version = "1.1.1"
description = "hGRS processor for atmospheric correction of high-spatial resolution and hyperspectral satellite images"
#readme = "pypi_README.rst"
authors = [{ name = "Tristan Harmel", email = "tristan.harmel@gmail.com" }]

license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["PRISMA", "EnMAP", "atmospheric correction", "EO satellite"]
requires-python = ">=3.9"

dependencies = [
    "h5netcdf",
    "netCDF4",
    "h5py",
    "scipy",
    "rasterio>=1.3.10", # numpy >= 2
    "xarray>=2024.06.0", # numpy >= 2
    "rioxarray>=0.15.0",
    "geopandas>=0.14.4",
    "zarr",
    "numba",
    "omnicloudmask",
    "xesmf"
]
dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"hgrs" = ['*.yml', 'data/lut/*.nc', 'data/aux/*']

[tool.setuptools.exclude-package-data]
"*" = [".gitattributes"]

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pip-tools", "pytest"]

[tool.setuptools.dynamic]
version = { attr = "hgrs.__version__" }

[project.scripts]
hgrs_prisma = "hgrs.run_prisma:main"
hgrs_enmap = "hgrs.run_enmap:main"

[project.urls]
Homepage = "https://github.com/Tristanovsk/hgrs"
Documentation = "https://hgrs.readthedocs.io"